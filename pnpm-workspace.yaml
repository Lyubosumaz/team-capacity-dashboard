# The apps in this repo. apps/server is Go; its package.json only holds
# scripts, so the root pnpm commands run both apps.
packages:
  - apps/*

# Packages allowed (true) or not (false) to run install scripts.
allowBuilds:
  "@firebase/util": false
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  protobufjs: false
  sharp: true
